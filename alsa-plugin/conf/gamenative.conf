# GameNative Audio as the container's default PCM.
#
# Installed as <imagefs>/usr/share/alsa/gamenative.conf and selected by adding it to
# ALSA_CONFIG_PATH after the stock config:
#
#   ALSA_CONFIG_PATH=<rootDir>/usr/share/alsa/alsa.conf:<rootDir>/usr/share/alsa/gamenative.conf
#
# Two things about that path are not optional, and both were learned the hard way:
#
#   * It must be the **host** path. The code reading this file is native bionic code
#     inside the Android process, so a container path like /usr/share/alsa resolves
#     against Android's own root and matches nothing: libasound reports "Cannot access
#     file /usr/share/alsa/gamenative.conf" and every snd_pcm_open then fails with
#     "Unknown PCM default".
#   * It must be a **list**, with the stock alsa.conf first. The image's libasound is
#     compiled with a config directory belonging to a package that does not exist here
#     (/data/data/com.winlator/...), so its own default configuration is unreachable;
#     naming alsa.conf explicitly is what loads the stock PCMs, ctls and hooks at all.
#     Ours comes second, so these definitions win.
#
# Because the stock config is supplied that way, this file includes nothing. An
# include of "/usr/share/alsa/alsa.conf" here would fail for exactly the first reason.
#
# The `plug` wrapper converts an app's own format (44100, mono, 24-bit) to what the
# engine carries: 48000 Hz in S16_LE, S32_LE or FLOAT_LE, which is the rate the device
# runs at and the formats it converts without a resampler.

pcm.gnhw {
    type gamenative
    hint {
        show on
        description "GameNative Audio"
    }
}

pcm.!default {
    type plug
    slave.pcm "gnhw"
    hint {
        show on
        description "GameNative Audio (default)"
    }
}
