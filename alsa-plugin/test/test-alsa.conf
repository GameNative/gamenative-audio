# A self-contained ALSA configuration for the device test: no include of the image's
# alsa.conf, no defaults from anywhere else, just this PCM and a default that reaches
# it. `ALSA_CONFIG_PATH` points here, so a pass cannot be an accident of the ambient
# configuration.

pcm.gnhw {
    type gamenative
}

pcm.!default {
    type plug
    slave.pcm "gnhw"
}
